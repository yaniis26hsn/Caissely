[package]
name = "inventory-manager"
version = "1.0.0"
description = "Offline-first inventory, point of sale and credit manager for Algerian superettes"
authors = ["Inventory Manager"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "inventory_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
